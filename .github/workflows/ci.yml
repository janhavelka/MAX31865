name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static contract checks
        run: |
          python scripts/generate_version.py --check
          python tools/check_transport_contract.py
          python tools/check_core_timing_guard.py
          python tools/check_framework_boundaries.py
          python tools/check_deleted_api.py
          python tools/check_cli_contract.py
          python tools/check_version_metadata.py
          python tools/check_header_hygiene.py
          python tools/check_firmware_integration_contract.py
          python tools/test_run_max31865_hil_parser.py

      - name: Run strict native suite
        run: python tools/run_native_suite.py

      - name: Check whitespace
        # Inspect the committed tree, while preserving byte-exact vendor reference
        # artifacts whose original formatting intentionally contains padding.
        run: >-
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- .
          ':(exclude)docs/vendor-reference-code/**'
          ':(exclude)docs/pdf-extracted-md/**'

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full native suite with ${{ matrix.sanitizer }} sanitizer
        run: python tools/run_native_suite.py --sanitizer ${{ matrix.sanitizer }}

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen=1.9.8+ds-2build5
          test "$(doxygen --version)" = "1.9.8"

      - name: Build warning-clean public documentation
        run: doxygen Doxyfile

  arduino-examples:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - ex_bringup_s3
          - ex_bringup_s2
          - ex_continuous_s3
          - ex_continuous_s2
          - ex_one_shot_s3
          - ex_one_shot_s2
          - ex_fault_diagnostics_s3
          - ex_fault_diagnostics_s2
          - ex_rtd_configuration_s3
          - ex_rtd_configuration_s2
          - ex_diagnostic_s3
          - ex_diagnostic_s2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-6.1.19-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Install exact PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Build ${{ matrix.environment }}
        run: python -m platformio run -e ${{ matrix.environment }}

  packaged-consumers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-package-6.1.19-${{ hashFiles('platformio.ini', 'library.json', 'tools/package_manifest.txt') }}

      - name: Install exact PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Validate exact archive and clean installed consumers
        run: python tools/check_packaged_consumer.py
